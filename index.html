<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXAS189 - Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <!-- Pakai link gambar langsung agar tidak broken -->
            <img src="https://ibb.co/gLBRZBpy" alt="TEXAS189 Logo">
            <span>TEXAS<b>189</b></span>
        </div>
        <div class="nav-buttons">
            <a href="https://mp001.texas189c.site/" class="btn btn-outline-sm">LOGIN</a>
            <a href="https://mp001.texas189c.site/" class="btn btn-filled-sm">REGISTER</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">
            TEXAS189, Cahaya Senja Membuka Peluang Baru Setiap Hari
        </h1>
        <p class="hero-desc">
            TEXAS189 memadukan pesona cahaya senja dengan sentuhan teknologi modern, menghadirkan akses responsif, performa optimal, serta pengalaman digital yang nyaman dan berkelas.
        </p>

        <!-- CTA Buttons -->
        <div class="cta-container">
            <a href="https://mp001.texas189c.site/" class="btn btn-outline">LOGIN</a>
            <a href="https://mp001.texas189c.site/" class="btn btn-filled">REGISTER</a>
        </div>

        <!-- Banner Image -->
        <div class="banner-box">
            <!-- Menggunakan URL gambar langsung yang valid -->
            <img src="https://picsum.photos/800/400" alt="TEXAS189 Banner" class="banner-img">
        </div>
    </section>

    <!-- Bottom Sticky Navigation -->
    <div class="bottom-nav">
        <a href="https://mp001.texas189c.site/" class="btn btn-outline-sm">LOGIN</a>
        <a href="https://mp001.texas189c.site/" class="btn btn-filled-sm">REGISTER</a>
    </div>

</body>
</html>
